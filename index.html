// Chat Manager
class ChatManager {
    constructor(state, dom) {
        this.state = state;
        this.dom = dom;
    }

    async createNewChat(shouldLoad = true) {
        const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const newChat = {
            id: chatId,
            title: this.state.t('newChatTitle'),
            messages: [],
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            language: this.state.currentLanguage
        };

        const dbResult = await DatabaseService.saveChat(
            chatId,
            newChat.title,
            newChat.messages,
            newChat.language,
            this.state.userId
        );

        if (dbResult.success) {
            this.state.chatHistory.unshift(newChat);
            DatabaseService.saveToLocalStorageBackup(chatId, newChat);
        } else {
            this.state.chatHistory.unshift(newChat);
            DatabaseService.saveToLocalStorageBackup(chatId, newChat);
        }

        if (shouldLoad) {
            await this.loadChat(chatId);
        }

        await this.renderChatHistory();
        return newChat;
    }

    async loadChat(chatId) {
        try {
            let chat = this.state.chatHistory.find(c => c.id === chatId);

            if (!chat) {
                const dbResult = await DatabaseService.loadChat(chatId, this.state.userId);

                if (dbResult.success && dbResult.data) {
                    chat = {
                        id: dbResult.data.chat_id,
                        title: dbResult.data.title,
                        messages: JSON.parse(dbResult.data.messages),
                        createdAt: dbResult.data.created_at,
                        updatedAt: dbResult.data.updated_at,
                        language: dbResult.data.language || 'id'
                    };
                    this.state.chatHistory.push(chat);
                } else {
                    const backupChats = DatabaseService.loadFromLocalStorageBackup();
                    chat = backupChats.find(c => c.id === chatId);
                    if (chat) this.state.chatHistory.push(chat);
                }
            }

            if (!chat) {
                this.showError(this.state.t('chatNotFound'));
                return;
            }

            this.state.currentChatId = chat.id;
            this.state.isFirstMessage = chat.messages.length === 0;

            this.clearChatContainer();

            if (this.state.isFirstMessage) {
                this.showWelcomeState();
            } else {
                this.hideWelcomeState();
                chat.messages.forEach(message => {
                    if (message.type === 'verse') {
                        this.displayVerseResponse(message.ai);
                    } else if (message.type === 'prayer') {
                        if (message.ai && message.ai.data) {
                            this.displayPrayerReading(message.ai.data);
                        } else {
                            this.displayPrayerAIResponse(message.ai);
                        }
                    } else {
                        this.appendUserMessage(message.user);
                        if (typeof message.ai === 'string') {
                            this.appendAIResponse(message.ai);
                        } else if (message.ai && message.ai.answer) {
                            this.appendAIResponse(message.ai.answer);
                        } else if (message.ai && message.ai.response) {
                            this.appendAIResponse(message.ai.response);
                        }
                    }
                });
            }

            await this.renderChatHistory();
            this.updateChatTitle(chat.title);
            this.scrollToBottom();
        } catch (error) {
            console.error('Failed to load chat:', error);
            this.showError(this.state.t('loadChatFailed'));
        }
    }

    appendUserMessage(text) {
        const messageEl = this.createMessageElement('user-message', text);
        this.dom.chatContainer.appendChild(messageEl);
    }

    appendAIResponse(text) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';
        responseEl.innerHTML = `
            <div class="ai-header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <span>Ustad AI</span>
            </div>
            <div class="ai-text">${text}</div>
        `;
        this.dom.chatContainer.appendChild(responseEl);
    }

    displayVerseResponse(verseData) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';

        const html = `
            <div class="ai-header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <span>${this.state.t('verseHeader')}</span>
            </div>
            <div class="verse-header">
                <span class="surah-title">${verseData.surahNameArabic || verseData.surahName} (${verseData.surahNumber}:${verseData.ayahNumber})</span>
            </div>
            <div class="arabic-text" dir="rtl">
                ${verseData.arabicText}
            </div>
            <div class="translation-text">
                ${this.state.t('translationLabel')} ${verseData.translationText}
            </div>
        `;

        responseEl.innerHTML = html;
        this.dom.chatContainer.appendChild(responseEl);
        this.scrollToBottom();
    }

    showError(message) {
        const errorEl = document.createElement('div');
        errorEl.className = 'ai-response error-message';
        errorEl.textContent = message;
        this.dom.chatContainer.appendChild(errorEl);
        this.scrollToBottom();
    }

    createMessageElement(className, text) {
        const element = document.createElement('div');
        element.className = className;
        element.textContent = text;
        return element;
    }

    showTypingIndicator() {
        const typingEl = document.createElement('div');
        typingEl.className = 'ai-response';
        typingEl.innerHTML = `
            <div class="ai-header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <span>Ustad AI</span>
            </div>
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;
        this.dom.chatContainer.appendChild(typingEl);
        this.scrollToBottom();
        return typingEl;
    }

    removeTypingIndicator() {
        const typingEl = this.dom.chatContainer.querySelector('.typing-indicator');
        if (typingEl) {
            typingEl.parentElement.remove();
        }
    }

    showWelcomeState() {
        this.dom.welcomeState.classList.remove('hidden');
        this.dom.chatContainer.classList.remove('active');
    }

    hideWelcomeState() {
        this.dom.welcomeState.classList.add('hidden');
        this.dom.chatContainer.classList.add('active');
    }

    clearChatContainer() {
        this.dom.chatContainer.innerHTML = '';
    }

    updateChatTitle(title) {
        this.dom.chatTitle.innerHTML = `<span class="logo-icon">${title || 'Ustad'}</span> AI`;
    }

    scrollToBottom() {
        setTimeout(() => {
            if (this.dom.chatContainer) {
                this.dom.chatContainer.scrollTop = this.dom.chatContainer.scrollHeight;
            }
        }, 10);
    }

    async loadFromDatabase() {
        try {
            const result = await DatabaseService.loadChats(this.state.userId, 50, 0);

            if (result.success && result.data) {
                this.state.chatHistory = result.data.map(dbChat => ({
                    id: dbChat.chat_id,
                    title: dbChat.title,
                    messages: JSON.parse(dbChat.messages),
                    createdAt: dbChat.created_at,
                    updatedAt: dbChat.updated_at,
                    language: dbChat.language || 'id'
                })).sort((a, b) => 
                    new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime()
                );
                return true;
            } else {
                this.state.chatHistory = DatabaseService.loadFromLocalStorageBackup();
                return false;
            }
        } catch (error) {
            this.state.chatHistory = DatabaseService.loadFromLocalStorageBackup();
            return false;
        }
    }

    async renderChatHistory() {
        if (!this.dom.chatHistoryList) return;

        if (this.state.chatHistory.length === 0) {
            await this.loadFromDatabase();
        }

        this.dom.chatHistoryList.innerHTML = '';

        if (this.state.chatHistory.length === 0) {
            this.dom.chatHistoryList.innerHTML = `
                <div class="no-chats-message">
                    ${this.state.t('noChatHistory')}
                </div>
            `;
            return;
        }

        this.state.chatHistory.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-history-item ${chat.id === this.state.currentChatId ? 'active' : ''}`;
            item.dataset.chatId = chat.id;

            item.innerHTML = `
                <div class="chat-preview">
                    <div class="chat-preview-title">${chat.title}</div>
                    <div class="chat-preview-date">${this.formatDate(chat.updatedAt || chat.createdAt)}</div>
                </div>
                <button class="delete-chat-btn" data-chat-id="${chat.id}" title="${this.state.t('deleteTitle')}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            `;

            item.addEventListener('click', () => this.loadChat(chat.id));

            const deleteBtn = item.querySelector('.delete-chat-btn');
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                this.deleteChat(chat.id);
            });

            this.dom.chatHistoryList.appendChild(item);
        });
    }

    async deleteChat(chatId) {
        const message = this.state.t('deleteConfirm');

        const confirmed = await window.showConfirm(message, {
            title: this.state.t('deleteConfirmTitle'),
            confirmText: this.state.t('confirmOk'),
            cancelText: this.state.t('confirmCancel')
        });

        if (!confirmed) return;

        const wasActiveChat = this.state.currentChatId === chatId;

        await DatabaseService.deleteChat(chatId, this.state.userId);
        DatabaseService.deleteFromLocalStorageBackup(chatId);

        this.state.chatHistory = this.state.chatHistory.filter(chat => chat.id !== chatId);

        if (wasActiveChat) {
            if (this.state.chatHistory.length > 0) {
                await this.loadChat(this.state.chatHistory[0].id);
            } else {
                this.state.reset();
                this.showWelcomeState();
            }
        }

        await this.renderChatHistory();
    }

    async saveMessageToHistory(userMessage, aiResponse, type = 'text') {
        let currentChat = this.state.chatHistory.find(c => c.id === this.state.currentChatId);

        if (!currentChat) {
            currentChat = await this.createNewChat(false);
            this.state.currentChatId = currentChat.id;
        }

        if (currentChat.messages.length === 0) {
            const title = userMessage.substring(0, 40) + (userMessage.length > 40 ? '...' : '');
            currentChat.title = title;
            this.updateChatTitle(title);
        }

        currentChat.messages.push({
            user: userMessage,
            ai: aiResponse,
            type: type,
            timestamp: new Date().toISOString()
        });

        currentChat.updatedAt = new Date().toISOString();
        currentChat.language = this.state.currentLanguage;

        await DatabaseService.saveChat(
            currentChat.id,
            currentChat.title,
            currentChat.messages,
            currentChat.language,
            this.state.userId
        );

        DatabaseService.saveToLocalStorageBackup(currentChat.id, currentChat);

        this.state.chatHistory = this.state.chatHistory.filter(c => c.id !== currentChat.id);
        this.state.chatHistory.unshift(currentChat);

        await this.renderChatHistory();
    }

    formatDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffTime = Math.abs(now - date);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
            return this.state.t('today');
        } else if (diffDays === 1) {
            return this.state.t('yesterday');
        } else {
            return date.toLocaleDateString(this.state.currentLanguage === 'id' ? 'id-ID' : 'en-US', {
                day: 'numeric',
                month: 'short'
            });
        }
    }
}

// Verse Manager
class VerseManager {
    constructor(state, dom, chatManager) {
        this.state = state;
        this.dom = dom;
        this.chatManager = chatManager;
    }

    async loadSurahData() {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/surah`);
            if (!response.ok) throw new Error('Failed to load surah list');

            const data = await response.json();
            this.state.surahData = data;
            this.buildSurahMap();
            return true;
        } catch (error) {
            return false;
        }
    }

    buildSurahMap() {
        this.state.surahMap.clear();
        this.state.surahData.forEach(surah => {
            this.state.surahMap.set(surah.id, {
                id: surah.id,
                name: surah.name,
                nameArabic: surah.name,
                nameTranslation: surah.translation,
                ayahs: surah.total_verses
            });
        });
    }

    populateSurahSelect() {
        if (!this.dom.surahSelect || this.state.surahData.length === 0) return;

        this.dom.surahSelect.innerHTML = '';
        this.state.surahData.forEach(surah => {
            const option = document.createElement('option');
            option.value = surah.id;
            option.textContent = `${surah.id}. ${surah.name} (${surah.translation}) - ${surah.total_verses} ${this.state.t('ayahsUnit')}`;
            this.dom.surahSelect.appendChild(option);
        });

        this.populateVerseSelect();
    }

    populateVerseSelect() {
        if (!this.dom.verseSelect) return;

        const selectedSurahId = parseInt(this.dom.surahSelect.value);
        const selectedSurah = this.state.surahMap.get(selectedSurahId);

        this.dom.verseSelect.innerHTML = '';

        if (selectedSurah) {
            for (let i = 1; i <= selectedSurah.ayahs; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = this.state.t('verseOption', i);
                this.dom.verseSelect.appendChild(option);
            }
        }
    }

    async getSpecificVerse() {
        const surahNumber = this.dom.surahSelect.value;
        const ayahNumber = parseInt(this.dom.verseSelect.value);

        if (!surahNumber || !ayahNumber) return;

        this.closeActionSheet();

        const surahInfo = this.state.surahMap.get(parseInt(surahNumber));
        if (!surahInfo) return;

        const userMessage = this.state.t('showVerseMsg', surahInfo.name, ayahNumber);

        this.chatManager.appendUserMessage(userMessage);

        if (this.state.isFirstMessage) {
            this.chatManager.hideWelcomeState();
            this.state.isFirstMessage = false;
            if (this.state.currentChatId === null) {
                this.chatManager.createNewChat(false);
            }
        }

        const typingEl = this.chatManager.showTypingIndicator();

        try {
            const arabicResponse = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/quran-uthmani`);
            const arabicData = await arabicResponse.json();

            // Use correct translation edition based on current language
            const edition = Constants.TRANSLATION_EDITIONS[this.state.currentLanguage] || Constants.TRANSLATION_EDITIONS.id;
            const translationResponse = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${edition}`);
            const translationData = await translationResponse.json();

            if (arabicData.code !== 200 || translationData.code !== 200) {
                throw new Error('Failed to fetch verse data');
            }

            const arabicAyah = arabicData.data.ayahs.find(ayah => ayah.numberInSurah === ayahNumber);
            const translationAyah = translationData.data.ayahs.find(ayah => ayah.numberInSurah === ayahNumber);

            typingEl.remove();

            const verseData = {
                surahNumber: parseInt(surahNumber),
                surahName: surahInfo.name,
                surahNameArabic: surahInfo.nameArabic,
                ayahNumber: ayahNumber,
                arabicText: arabicAyah?.text || '',
                translationText: translationAyah?.text || this.state.t('translationUnavailable')
            };

            this.chatManager.displayVerseResponse(verseData);
            this.chatManager.saveMessageToHistory(userMessage, verseData, 'verse');

        } catch (error) {
            typingEl.remove();
            this.chatManager.showError(this.state.t('loadVerseFailed'));
        }
    }

    openActionSheet() {
        this.dom.actionSheetOverlay.classList.add('active');
        this.dom.actionSheet.classList.add('active');

        if (this.state.surahData.length > 0) {
            this.populateSurahSelect();
        } else {
            this.dom.surahSelect.innerHTML = `<option>${this.state.t('loadingSurah')}</option>`;
            this.loadSurahData().then(() => this.populateSurahSelect());
        }
    }

    closeActionSheet() {
        this.dom.actionSheetOverlay.classList.remove('active');
        this.dom.actionSheet.classList.remove('active');
    }
}

// Voice Manager
// ========== Voice Manager — ElevenLabs REST API via /api/voice-ask ==========
class VoiceManager {
    constructor(state, dom, chatManager) {
        this.state = state;
        this.dom = dom;
        this.chatManager = chatManager;
        this.isListening = false;
        this.isProcessing = false;
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.stream = null;
        this.currentAudio = null;
    }

    openVoicePanel() {
        this.dom.voiceOffcanvasOverlay.classList.add('active');
        this.dom.offcanvasVoice.classList.add('active');
        this.stopWaveAnimation();
        this.resetMicButton();
    }

    toggleVoiceRecording() {
        if (this.isProcessing) return;

        const micButton = document.getElementById('micButton');
        if (!this.isListening) {
            this.startVoiceRecording();
            if (micButton) micButton.classList.add('listening');
        } else {
            this.stopVoiceRecording();
            if (micButton) micButton.classList.remove('listening');
        }
    }

    async startVoiceRecording() {
        if (this.isListening || this.isProcessing) return;

        try {
            this.stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    sampleRate: 16000
                }
            });

            this.audioChunks = [];
            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                ? 'audio/webm;codecs=opus'
                : MediaRecorder.isTypeSupported('audio/webm')
                    ? 'audio/webm'
                    : 'audio/mp4';

            this.mediaRecorder = new MediaRecorder(this.stream, { mimeType });

            this.mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    this.audioChunks.push(e.data);
                }
            };

            this.mediaRecorder.onstop = async () => {
                this.isListening = false;
                this.stopWaveAnimation();
                this.resetMicButton();
                this.stopStream();

                if (this.audioChunks.length === 0) {
                    this.chatManager.showError(this.state.t('errorOccurred'));
                    return;
                }

                const blob = new Blob(this.audioChunks, { type: mimeType });
                await this.sendVoiceToBackend(blob);
            };

            this.mediaRecorder.start(250);
            this.isListening = true;
            this.startWaveAnimation();

            // Auto-stop after 30 seconds max
            this._autoStopTimer = setTimeout(() => {
                if (this.isListening) this.stopVoiceRecording();
            }, 30000);

        } catch (err) {
            console.error('Microphone error:', err);
            this.isListening = false;
            this.resetMicButton();
            this.stopWaveAnimation();
            if (window.showAlert) {
                await window.showAlert(
                    this.state.currentLanguage === 'id'
                        ? 'Tidak bisa mengakses mikrofon. Pastikan izin mic sudah diberikan.'
                        : 'Cannot access microphone. Please allow mic permission.'
                );
            } else {
                this.chatManager.showError(
                    this.state.currentLanguage === 'id'
                        ? 'Tidak bisa mengakses mikrofon.'
                        : 'Cannot access microphone.'
                );
            }
        }
    }

    stopVoiceRecording() {
        if (this._autoStopTimer) {
            clearTimeout(this._autoStopTimer);
            this._autoStopTimer = null;
        }
        if (this.mediaRecorder && this.isListening) {
            try {
                this.mediaRecorder.stop();
            } catch (e) {
                this.isListening = false;
                this.stopWaveAnimation();
                this.resetMicButton();
                this.stopStream();
            }
        }
    }

    stopStream() {
        if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
            this.stream = null;
        }
    }

    async sendVoiceToBackend(audioBlob) {
        this.isProcessing = true;
        this.chatManager.hideWelcomeState();
        this.state.isFirstMessage = false;

        if (this.state.currentChatId === null) {
            await this.chatManager.createNewChat(false);
        }

        // Show temporary "listening..." user bubble
        const processingMsg = this.state.currentLanguage === 'id'
            ? '🎤 Memproses suara...'
            : '🎤 Processing voice...';
        this.chatManager.appendUserMessage(processingMsg);

        const typingEl = this.chatManager.showTypingIndicator();

        try {
            const formData = new FormData();
            const ext = audioBlob.type.includes('webm') ? 'webm' : 'mp4';
            formData.append('audio', audioBlob, `recording.${ext}`);
            formData.append('language', this.state.currentLanguage);

            const response = await fetch(`${Constants.WORKER_URL}/api/voice-ask`, {
                method: 'POST',
                body: formData
            });

            // Remove the temporary processing message
            const userMsgs = this.dom.chatContainer.querySelectorAll('.user-message');
            if (userMsgs.length) userMsgs[userMsgs.length - 1].remove();

            typingEl.remove();

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || errData.message || `HTTP ${response.status}`);
            }

            const contentType = response.headers.get('Content-Type') || '';

            // Get text from headers (backend sets these)
            const question = decodeURIComponent(response.headers.get('X-Text-Question') || '');
            const answer = decodeURIComponent(response.headers.get('X-Text-Answer') || '');

            if (question) {
                this.chatManager.appendUserMessage(question);
            }

            if (contentType.includes('audio')) {
                // Play ElevenLabs audio
                const audioBlobRes = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlobRes);

                // Show text answer in chat
                if (answer) {
                    this.displayTextResponse(answer);
                    await this.chatManager.saveMessageToHistory(question || processingMsg, { answer, success: true }, 'quran_ai');
                }

                // Play audio
                this.playAudio(audioUrl);
            } else {
                // Fallback JSON response (no audio)
                const data = await response.json();
                const q = data.question || question || processingMsg;
                const a = data.answer || answer || '';

                if (!question && data.question) {
                    this.chatManager.appendUserMessage(data.question);
                }
                if (a) {
                    this.displayTextResponse(a);
                    await this.chatManager.saveMessageToHistory(q, { answer: a, success: true }, 'quran_ai');
                }
            }

        } catch (error) {
            console.error('Voice ask failed:', error);
            typingEl.remove();
            // Remove temp message if still there
            const userMsgs = this.dom.chatContainer.querySelectorAll('.user-message');
            if (userMsgs.length) {
                const last = userMsgs[userMsgs.length - 1];
                if (last.textContent.includes('🎤')) last.remove();
            }
            this.chatManager.showError(
                this.state.currentLanguage === 'id'
                    ? 'Gagal memproses suara. Coba lagi.'
                    : 'Failed to process voice. Please try again.'
            );
        } finally {
            this.isProcessing = false;
        }
    }

    displayTextResponse(text) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';
        responseEl.innerHTML = `
            <div class="ai-header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <span>Ustad AI</span>
            </div>
            <div class="ai-text">${text}</div>
        `;
        this.dom.chatContainer.appendChild(responseEl);
        this.chatManager.scrollToBottom();
    }

    playAudio(url) {
        if (this.currentAudio) {
            this.currentAudio.pause();
            this.currentAudio = null;
        }
        const audio = new Audio(url);
        this.currentAudio = audio;
        audio.play().catch(err => console.warn('Audio play failed:', err));
        audio.onended = () => {
            URL.revokeObjectURL(url);
            this.currentAudio = null;
        };
    }

    startWaveAnimation() {
        const waveBars = document.querySelector('.wave-bars');
        if (waveBars) waveBars.classList.add('active');
    }

    stopWaveAnimation() {
        const waveBars = document.querySelector('.wave-bars');
        if (waveBars) waveBars.classList.remove('active');
    }

    resetMicButton() {
        const micButton = document.getElementById('micButton');
        if (micButton) micButton.classList.remove('listening');
    }

    closeVoicePanel() {
        this.stopVoiceRecording();
        if (this.currentAudio) {
            this.currentAudio.pause();
            this.currentAudio = null;
        }
        this.dom.voiceOffcanvasOverlay.classList.remove('active');
        this.dom.offcanvasVoice.classList.remove('active');
        this.stopWaveAnimation();
        this.resetMicButton();
    }
}

// AI Response Handler
class AIResponseHandler {
    constructor(state, dom, chatManager) {
        this.state = state;
        this.dom = dom;
        this.chatManager = chatManager;
    }

    displayAIResponse(backendResponse) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';

        let html = `
            <div class="ai-header-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <span>Ustad AI</span>
            </div>
        `;

        if (backendResponse.success) {
            html += `<div class="ai-text">${backendResponse.answer}</div>`;

            if (backendResponse.verses_data && backendResponse.verses_data.length > 0) {
                html += `<div class="verses-section" style="margin-top: 1rem;">`;
                backendResponse.verses_data.forEach(verse => {
                    html += `
                        <div class="verse-container">
                            <div class="verse-reference">${verse.reference}</div>
                            <div class="arabic-text" dir="rtl">${verse.verse_arabic}</div>
                            <div class="translation-text">${verse.verse_translation}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            if (backendResponse.disclaimer) {
                html += `<div class="disclaimer">${backendResponse.disclaimer}</div>`;
            }

        } else {
            html += `<div class="error-message">${backendResponse.error || this.state.t('errorOccurred')}</div>`;
        }

        responseEl.innerHTML = html;
        this.dom.chatContainer.appendChild(responseEl);
        this.chatManager.scrollToBottom();
    }
}

// Main Application
class QuranAIApp {
    constructor() {
        this.state = new AppState();
        this.dom = new DomElements();
        this.chatManager = new ChatManager(this.state, this.dom);
        this.verseManager = new VerseManager(this.state, this.dom, this.chatManager);
        this.voiceManager = new VoiceManager(this.state, this.dom, this.chatManager);
        this.aiHandler = new AIResponseHandler(this.state, this.dom, this.chatManager);

        this.sendMessage = this.sendMessage.bind(this);
        this.toggleLanguage = this.toggleLanguage.bind(this);
        this.openOffcanvasMenu = this.openOffcanvasMenu.bind(this);
        this.closeOffcanvasMenu = this.closeOffcanvasMenu.bind(this);
        this.openOffcanvasVoice = this.openOffcanvasVoice.bind(this);
        this.closeOffcanvasVoice = this.closeOffcanvasVoice.bind(this);
        this.updateSendButtonState = this.updateSendButtonState.bind(this);
        this.adjustTextareaHeight = this.adjustTextareaHeight.bind(this);
    }

    async init() {
        if (!this.dom.validate()) return;

        // Restore saved language preference
        const savedLang = localStorage.getItem('quran_lang');
        if (savedLang && (savedLang === 'id' || savedLang === 'en')) {
            this.state.setLanguage(savedLang);
        }

        // Init themed global modals
        GlobalModal.init();

        this.setupEventListeners();
        await this.loadInitialData();
        this.applyLanguage();
        await this.fetchNeuronStatus();

        // Refresh neuron status every 60s
        setInterval(() => this.fetchNeuronStatus(), 60000);
    }

    async loadInitialData() {
        await this.chatManager.loadFromDatabase();
        await this.verseManager.loadSurahData();

        if (this.state.chatHistory.length > 0) {
            await this.chatManager.loadChat(this.state.chatHistory[0].id);
        }
    }

    // Full UI translation applicator
    applyLanguage() {
        const lang = this.state.currentLanguage;

        // Update lang label & toggle
        this.dom.langLabel.textContent = Constants.SUPPORTED_LANGUAGES[lang];
        this.dom.languageToggle.checked = lang === 'en';

        // Update all elements with data-i18n
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.textContent = this.state.t(key);
        });

        // Update placeholders
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            el.placeholder = this.state.t(key);
        });

        // Update titles
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            el.title = this.state.t(key);
        });

        // Re-render chat history (dates, empty state, etc)
        this.chatManager.renderChatHistory();

        // Update current chat title if needed
        if (this.state.currentChatId) {
            const currentChat = this.state.chatHistory.find(c => c.id === this.state.currentChatId);
            if (currentChat) {
                this.chatManager.updateChatTitle(currentChat.title);
            }
        }
    }

    adjustTextareaHeight() {
        const textarea = this.dom.messageInput;
        textarea.style.height = '24px';
        const scrollHeight = textarea.scrollHeight;
        if (scrollHeight > 24) {
            textarea.style.height = `${Math.min(scrollHeight, 160)}px`;
        }
    }

    setupEventListeners() {
        this.dom.sendBtn.addEventListener('click', this.sendMessage);

        this.dom.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.sendMessage();
            }
        });

        this.dom.messageInput.addEventListener('input', () => {
            this.adjustTextareaHeight();
            this.updateSendButtonState();
        });

        this.dom.menuIcon.addEventListener('click', this.openOffcanvasMenu);
        this.dom.offcanvasOverlay.addEventListener('click', this.closeOffcanvasMenu);
        if (this.dom.closeOffcanvas) {
            this.dom.closeOffcanvas.addEventListener('click', this.closeOffcanvasMenu);
        }

        this.dom.newChatBtn.addEventListener('click', () => {
            this.chatManager.createNewChat();
        });

        this.dom.languageToggle.addEventListener('change', this.toggleLanguage);

        this.dom.selectVerseBtn.addEventListener('click', () => {
            this.verseManager.openActionSheet();
        });

        if (this.dom.closeActionSheet) {
            this.dom.closeActionSheet.addEventListener('click', () => {
                this.verseManager.closeActionSheet();
            });
        }

        if (this.dom.actionSheetOverlay) {
            this.dom.actionSheetOverlay.addEventListener('click', () => {
                this.verseManager.closeActionSheet();
            });
        }

        if (this.dom.surahSelect) {
            this.dom.surahSelect.addEventListener('change', () => {
                this.verseManager.populateVerseSelect();
            });
        }

        if (this.dom.goVerseBtn) {
            this.dom.goVerseBtn.addEventListener('click', () => {
                this.verseManager.getSpecificVerse();
            });
        }

        if (this.dom.waveBtn) {
            this.dom.waveBtn.addEventListener('click', this.openOffcanvasVoice);
        }

        if (this.dom.closeOffcanvasVoice) {
            this.dom.closeOffcanvasVoice.addEventListener('click', this.closeOffcanvasVoice);
        }

        if (this.dom.voiceOffcanvasOverlay) {
            this.dom.voiceOffcanvasOverlay.addEventListener('click', this.closeOffcanvasVoice);
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('#micButton')) {
                this.voiceManager.toggleVoiceRecording();
            }
        });
    }

    async sendMessage() {
        const userMessage = this.dom.messageInput.value.trim();
        if (!userMessage) return;

        this.dom.messageInput.value = '';
        this.dom.messageInput.style.height = '24px';
        this.updateSendButtonState();

        this.chatManager.appendUserMessage(userMessage);

        if (this.state.isFirstMessage) {
            this.chatManager.hideWelcomeState();
            this.state.isFirstMessage = false;
            if (this.state.currentChatId === null) {
                await this.chatManager.createNewChat(false);
            }
        }

        const typingEl = this.chatManager.showTypingIndicator();

        try {
            const response = await ApiService.sendQuestion(userMessage, this.state.currentLanguage);
            typingEl.remove();

            this.aiHandler.displayAIResponse(response);
            await this.chatManager.saveMessageToHistory(userMessage, response, 'quran_ai');

        } catch (error) {
            typingEl.remove();
            this.chatManager.showError(this.state.t('processError'));
        }
    }

    toggleLanguage() {
        const newLanguage = this.dom.languageToggle.checked ? 'en' : 'id';

        if (this.state.setLanguage(newLanguage)) {
            this.applyLanguage();
            this.fetchNeuronStatus();
        }
    }

    updateSendButtonState() {
        const hasText = this.dom.messageInput.value.trim().length > 0;

        if (hasText) {
            this.dom.sendBtn.classList.add('visible');
            if (this.dom.waveBtn) this.dom.waveBtn.classList.add('hidden');
        } else {
            this.dom.sendBtn.classList.remove('visible');
            if (this.dom.waveBtn) this.dom.waveBtn.classList.remove('hidden');
        }
    }

    openOffcanvasMenu() {
        this.dom.offcanvasOverlay.classList.add('active');
        this.dom.offcanvasSidebar.classList.add('active');
        this.dom.menuIcon.classList.add('active');
        this.fetchNeuronStatus();
    }

    closeOffcanvasMenu() {
        this.dom.offcanvasOverlay.classList.remove('active');
        this.dom.offcanvasSidebar.classList.remove('active');
        this.dom.menuIcon.classList.remove('active');
    }

    openOffcanvasVoice() {
        this.voiceManager.openVoicePanel();
    }

    closeOffcanvasVoice() {
        this.voiceManager.closeVoicePanel();
    }

    async fetchNeuronStatus() {
        try {
            const res = await fetch(`${Constants.WORKER_URL}/api/neuron-status`);
            if (!res.ok) return;
            const data = await res.json();
            if (data.success) {
                this.updateNeuronUI(data);
            }
        } catch (e) {
            console.warn('Failed to fetch neuron status:', e);
        }
    }

    updateNeuronUI(data) {
        const used = data.used ?? 0;
        const limit = data.daily_limit ?? 10000;
        const remaining = data.remaining ?? limit;
        const percent = data.percent ?? 0;
        const asleep = !!data.asleep;

        const usedEl = document.getElementById('neuronUsed');
        const limitEl = document.getElementById('neuronLimit');
        const remainingEl = document.getElementById('neuronRemaining');
        const barEl = document.getElementById('neuronBar');
        const badgeEl = document.getElementById('neuronBadge');

        if (usedEl) usedEl.textContent = Math.round(used).toLocaleString();
        if (limitEl) limitEl.textContent = limit.toLocaleString();
        if (remainingEl) remainingEl.textContent = Math.round(remaining).toLocaleString();

        if (barEl) {
            barEl.style.width = `${Math.min(100, percent)}%`;
            barEl.classList.remove('warn', 'danger');
            if (percent >= 90) barEl.classList.add('danger');
            else if (percent >= 70) barEl.classList.add('warn');
        }

        if (badgeEl) {
            badgeEl.classList.remove('awake', 'asleep');
            if (asleep) {
                badgeEl.classList.add('asleep');
                badgeEl.textContent = this.state.t('aiAsleep');
            } else {
                badgeEl.classList.add('awake');
                badgeEl.textContent = this.state.t('aiAwake');
            }
        }
    }
}
