<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustad - AI Quran</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --bg-main: #09090b;
            --bg-surface: #141417;
            --bg-card: #18181b;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(59, 130, 246, 0.5);
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --radius-lg: 1.25rem;
            --radius-md: 0.875rem;
            --radius-sm: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.875rem 1.5rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .menu-icon {
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .menu-icon:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-icon span {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-icon.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .menu-icon.active span:nth-child(2) {
            opacity: 0;
            transform: translateX(-10px);
        }

        .menu-icon.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .logo {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .logo-icon {
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* Language Toggle */
        .language-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
        }

        .lang-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-secondary);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        input:checked + .slider:before {
            transform: translateX(14px);
            background-color: #ffffff;
        }

        /* Main Content */
        .main-content {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 64px;
            padding-bottom: 140px;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        /* Welcome State */
        .welcome-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
            min-height: calc(100vh - 220px);
        }

        .welcome-state.hidden {
            opacity: 0;
            transform: translateY(-16px);
            pointer-events: none;
            position: absolute;
        }

        .stad-sparkle {
            width: 48px;
            height: 48px;
            margin-bottom: 1.25rem;
            filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.3));
        }

        .welcome-salutation {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.375rem;
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            max-width: 460px;
            line-height: 1.35;
        }

        /* Chat Container */
        .chat-container {
            position: relative;
            flex: 1;
            padding: 1.5rem 1rem;
            display: none;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto; 
            scroll-behavior: smooth;
            width: 100%;
        }

        .chat-container.active {
            display: flex;
        }

        /* User Message - Clean Minimalist Pill */
        .user-message {
            align-self: flex-end;
            background: #1f1f23;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            padding: 0.75rem 1.125rem;
            border-radius: 1.25rem 1.25rem 0.25rem 1.25rem;
            max-width: 82%;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(12px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* AI Response - Seamless & Flat Integration */
        .ai-response {
            align-self: flex-start;
            background: transparent;
            border: none;
            padding: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .ai-header-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: -0.25rem;
        }

        .ai-header-badge svg {
            width: 16px;
            height: 16px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-text {
            font-size: 0.975rem;
            line-height: 1.7;
            color: var(--text-primary);
            word-break: break-word;
        }

        /* Input Area - Auto Expanding on Focus */
        .input-area {
            max-width: 760px;
            width: calc(100% - 2rem);
            margin: 0 auto;
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, padding 0.25s ease;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .input-area:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(59, 130, 246, 0.2);
            padding: 0.875rem 1rem;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-field {
            display: flex;
            align-items: flex-end;
            width: 100%;
        }

        .input-field textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            resize: none; 
            overflow-y: auto;
            padding: 0; 
            height: 24px;
            max-height: 160px;
            font-family: inherit;
            line-height: 1.5;
            transition: height 0.15s ease-out;
        }

        .input-field textarea::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .verse-btn, .pry-btn, .wave-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .verse-btn:hover, .pry-btn:hover, .wave-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .send-btn {
            background: var(--accent-blue);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: none; 
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0);
            color: #ffffff;
        }

        .send-btn.visible {
            display: flex;
            transform: scale(1);
        }

        .send-btn:hover {
            background: var(--accent-blue-hover);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.5rem 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        /* Modals & Sheets Overlay */
        .action-sheet-overlay, .offcanvas-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .action-sheet-overlay.active, .offcanvas-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Action Sheet (Verse Picker) */
        .action-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        .action-sheet.active {
            transform: translateY(0);
        }

        .action-sheet-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-sheet-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close-action-sheet, .close-offcanvas {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .close-action-sheet:hover, .close-offcanvas:hover {
            color: var(--text-primary);
        }

        .action-sheet-body {
            padding: 1.25rem;
        }

        .verse-selection-controls {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .verse-selection-controls label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: -0.375rem;
        }

        .styled-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .styled-select:focus {
            border-color: var(--accent-blue);
        }

        .select-verse-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--accent-blue);
            border: none;
            color: #ffffff;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .select-verse-btn:hover {
            background: var(--accent-blue-hover);
        }

        /* Sidebar Offcanvas */
        .offcanvas-sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 320px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .offcanvas-sidebar.active {
            transform: translateX(0);
        }

        .offcanvas-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .offcanvas-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .offcanvas-body {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        .new-chat-btn svg {
            fill: var(--accent-blue);
        }

        .chat-history-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            padding: 0 0.5rem;
        }

        .chat-history-list {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .chat-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0.875rem;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .chat-history-item:hover {
            background: var(--bg-card);
        }

        .chat-history-item.active {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        .chat-preview {
            flex: 1;
            overflow: hidden;
            margin-right: 0.5rem;
        }

        .chat-preview-title {
            font-size: 0.875rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.125rem;
        }

        .chat-preview-date {
            font-size: 0.725rem;
            color: var(--text-muted);
        }

        .delete-chat-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.4;
            transition: opacity 0.2s;
            color: var(--text-secondary);
        }

        .delete-chat-btn:hover {
            opacity: 1;
            color: #ef4444;
        }

        .no-chats-message {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Quranic Text Styling - Seamless Flat Cards */
        .arabic-text {
            font-family: 'Amiri', 'Scheherazade New', serif;
            font-size: 1.65rem;
            line-height: 2.2;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border-right: 3px solid var(--accent-blue);
            margin: 0.5rem 0;
            color: #ffffff;
            text-align: right;
            direction: rtl;
        }

        .translation-text {
            font-size: 0.925rem;
            line-height: 1.6;
            padding: 0.875rem 1rem;
            background: rgba(16, 185, 129, 0.04);
            border-radius: var(--radius-sm);
            border-left: 2px solid var(--accent-green);
            color: var(--text-secondary);
        }

        .verse-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .surah-title {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .verse-container {
            margin: 0.875rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .verse-reference {
            font-size: 0.825rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.875rem;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
        }

        /* Voice Panel Offcanvas */
        .offcanvas-voice {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 320px;
        }

        .offcanvas-voice.active {
            transform: translateY(0);
        }

        .offcanvas-voice-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .offcanvas-voice-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .offcanvas-voice-body {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .wave-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            margin-bottom: 2rem;
        }

        .wave-bars {
            display: none; 
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 60px;
        }

        .wave-bars.active {
            display: flex;
        }

        .wave-bar {
            width: 4px;
            height: 32px;
            background: var(--accent-blue);
            border-radius: 2px;
            opacity: 0.7;
            animation: wave 1.2s infinite ease-in-out;
        }

        .wave-bar:nth-child(1) { animation-delay: -0.6s; }

// Constants
const Constants = {

// ========== Global Confirm & Alert System ==========
const GlobalModal = {
    _confirmResolve: null,
    _alertResolve: null,

    init() {
        // Confirm buttons
        document.getElementById('globalConfirmCancel')?.addEventListener('click', () => this._closeConfirm(false));
        document.getElementById('globalConfirmOk')?.addEventListener('click', () => this._closeConfirm(true));
        document.getElementById('globalConfirmOverlay')?.addEventListener('click', (e) => {
            if (e.target.id === 'globalConfirmOverlay') this._closeConfirm(false);
        });

        // Alert button
        document.getElementById('globalAlertOk')?.addEventListener('click', () => this._closeAlert());
        document.getElementById('globalAlertOverlay')?.addEventListener('click', (e) => {
            if (e.target.id === 'globalAlertOverlay') this._closeAlert();
        });

        // ESC key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('globalConfirmOverlay')?.classList.contains('active')) {
                    this._closeConfirm(false);
                } else if (document.getElementById('globalAlertOverlay')?.classList.contains('active')) {
                    this._closeAlert();
                }
            }
        });
    },

    /**
     * Show a themed confirm dialog
     * @param {string} message - The message to display
     * @param {object} options - Optional { title, confirmText, cancelText }
     * @returns {Promise<boolean>} - true if confirmed, false if cancelled
     */
    confirm(message, options = {}) {
        return new Promise((resolve) => {
            this._confirmResolve = resolve;

            const titleEl = document.getElementById('globalConfirmTitle');
            const messageEl = document.getElementById('globalConfirmMessage');
            const cancelBtn = document.getElementById('globalConfirmCancel');
            const okBtn = document.getElementById('globalConfirmOk');
            const overlay = document.getElementById('globalConfirmOverlay');

            // Get current language translations if available
            const app = window.quranAIApp;
            const t = (key) => app?.state?.t?.(key) || key;

            titleEl.textContent = options.title || t('deleteConfirmTitle') || 'Confirm';
            messageEl.textContent = message;
            cancelBtn.textContent = options.cancelText || t('confirmCancel') || 'Cancel';
            okBtn.textContent = options.confirmText || t('confirmOk') || 'OK';

            overlay.classList.add('active');
        });
    },

    /**
     * Show a themed alert dialog
     * @param {string} message - The message to display
     * @param {object} options - Optional { title, okText }
     * @returns {Promise<void>}
     */
    alert(message, options = {}) {
        return new Promise((resolve) => {
            this._alertResolve = resolve;

            const titleEl = document.getElementById('globalAlertTitle');
            const messageEl = document.getElementById('globalAlertMessage');
            const okBtn = document.getElementById('globalAlertOk');
            const overlay = document.getElementById('globalAlertOverlay');

            const app = window.quranAIApp;
            const t = (key) => app?.state?.t?.(key) || key;

            titleEl.textContent = options.title || t('alertTitle') || 'Info';
            messageEl.textContent = message;
            okBtn.textContent = options.okText || t('alertOk') || 'OK';

            overlay.classList.add('active');
        });
    },

    _closeConfirm(result) {
        document.getElementById('globalConfirmOverlay')?.classList.remove('active');
        if (this._confirmResolve) {
            this._confirmResolve(result);
            this._confirmResolve = null;
        }
    },

    _closeAlert() {
        document.getElementById('globalAlertOverlay')?.classList.remove('active');
        if (this._alertResolve) {
            this._alertResolve();
            this._alertResolve = null;
        }
    }
};

class AppState {
    constructor() {
        this.currentChatId = null;
        this.chatHistory = [];
        this.isFirstMessage = true;
        this.currentLanguage = Constants.DEFAULT_LANGUAGE;
        this.surahData = [];
        this.surahMap = new Map();
        this.mediaRecorder = null;
        this.isRecording = false;
        this.userId = this.generateUserId();
    }

    generateUserId() {
        let userId = localStorage.getItem('quran_user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('quran_user_id', userId);
        }
        return userId;
    }

    dual() {
        this.currentChatId = null;
        this.isFirstMessage = true;
        this.mediaRecorder = null;
        this.isRecording = false;
    }

    reset() {
        this.currentChatId = null;
        this.isFirstMessage = true;
        this.mediaRecorder = null;
        this.isRecording = false;
    }

    setLanguage(lang) {
        if (Object.keys(Constants.SUPPORTED_LANGUAGES).includes(lang)) {
            this.currentLanguage = lang;
            document.documentElement.lang = lang;
            localStorage.setItem('quran_lang', lang);
            return true;
        }
        return false;
    }

    t(key, ...args) {
        const dict = TRANSLATIONS[this.currentLanguage] || TRANSLATIONS.id;
        const value = dict[key];
        if (typeof value === 'function') {
            return value(...args);
        }
        return value || key;
    }
}

// Markdown Parser
class MarkdownParser {
    static parse(text) {
        if (!text) return '';

        let html = text;

        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.*?)_/g, '<em>$1</em>');

        html = this.formatNumberedLists(html);
        html = this.formatUnorderedLists(html);

        html = html.replace(/\n\n+/g, '</p><p>');
        html = html.replace(/\n/g, '<br>');
        html = `<p>${html}</p>`;

        html = html.replace(/<p><\/p>/g, '');
        html = html.replace(/<p><br><\/p>/g, '');

        return html;
    }

    static formatNumberedLists(text) {
        const lines = text.split('\n');
        let inList = false;
        let listHtml = '';
        let result = [];

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            const listMatch = line.match(/^(\d+)\.\s+(.*)/);

            if (listMatch) {
                if (!inList) {
                    inList = true;
                    listHtml = '<ol class="ai-list numbered">';
                }
                const itemText = listMatch[2];
                listHtml += `<li>${this.parseInlineMarkdown(itemText)}</li>`;
            } else {
                if (inList) {
                    inList = false;
                    listHtml += '</ol>';
                    result.push(listHtml);
                    listHtml = '';
                }
                result.push(line);
            }
        }

        if (inList) {
            listHtml += '</ol>';
            result.push(listHtml);
        }

        return result.join('\n');
    }

    static formatUnorderedLists(text) {
        const lines = text.split('\n');
        let inList = false;
        let listHtml = '';
        let result = [];

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            const listMatch = line.match(/^[-*]\s+(.*)/);

            if (listMatch) {
                if (!inList) {
                    inList = true;
                    listHtml = '<ul class="ai-list bulleted">';
                }
                const itemText = listMatch[1];
                listHtml += `<li>${this.parseInlineMarkdown(itemText)}</li>`;
            } else {
                if (inList) {
                    inList = false;
                    listHtml += '</ul>';
                    result.push(listHtml);
                    listHtml = '';
                }
                result.push(line);
            }
        }

        if (inList) {
            listHtml += '</ul>';
            result.push(listHtml);
        }

        return result.join('\n');
    }

    static parseInlineMarkdown(text) {
        let html = text;
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.*?)_/g, '<em>$1</em>');
        html = html.replace(/"(.*?)"/g, '<span dir="rtl" class="arabic-inline">$1</span>');
        return html;
    }
}

// Database Service
class DatabaseService {
    static async saveChat(chatId, title, messages, language = 'id', userId) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-ID': userId
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    title: title,
                    messages: messages,
                    language: language
                })
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to save chat to database:', error);
            return { success: false, error: error.message };
        }
    }

    static async loadChats(userId, limit = 50, offset = 0) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history?limit=${limit}&offset=${offset}`, {
                headers: {
                    'X-User-ID': userId
                }
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to load chats from database:', error);
            return { success: false, data: [] };
        }
    }

    static async loadChat(chatId, userId) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history/${chatId}`, {
                headers: {
                    'X-User-ID': userId
                }
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to load chat from database:', error);
            return { success: false, error: error.message };
        }
    }

    static async deleteChat(chatId, userId) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history/${chatId}`, {
                method: 'DELETE',
                headers: {
                    'X-User-ID': userId
                }
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to delete chat from database:', error);
            return { success: false, error: error.message };
        }
    }

    static saveToLocalStorageBackup(chatId, chatData) {
        try {
            const backupKey = `chat_backup_${chatId}`;
            const backupList = JSON.parse(localStorage.getItem('chat_backup_list') || '[]');

            localStorage.setItem(backupKey, JSON.stringify(chatData));

            if (!backupList.includes(chatId)) {
                backupList.push(chatId);
                localStorage.setItem('chat_backup_list', JSON.stringify(backupList));
            }
        } catch (error) {
            console.error('LocalStorage backup failed:', error);
        }
    }

    static loadFromLocalStorageBackup() {
        try {
            const backupList = JSON.parse(localStorage.getItem('chat_backup_list') || '[]');
            const chats = [];

            backupList.forEach(chatId => {
                const chatData = localStorage.getItem(`chat_backup_${chatId}`);
                if (chatData) {
                    chats.push(JSON.parse(chatData));
                }
            });

            return chats.sort((a, b) => 
                new Date(b.updatedAt || b.createdAt).getTime() - 
                new Date(a.updatedAt || a.createdAt).getTime()
            );
        } catch (error) {
            console.error('Failed to load from localStorage backup:', error);
            return [];
        }
    }

    static deleteFromLocalStorageBackup(chatId) {
        try {
            localStorage.removeItem(`chat_backup_${chatId}`);
            const backupList = JSON.parse(localStorage.getItem('chat_backup_list') || '[]');
            const newBackupList = backupList.filter(id => id !== chatId);
            localStorage.setItem('chat_backup_list', JSON.stringify(newBackupList));
        } catch (error) {
            console.error('Failed to delete from localStorage backup:', error);
        }
    }
}
