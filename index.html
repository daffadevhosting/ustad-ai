<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustad - AI Quran</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --bg-main: #09090b;
            --bg-surface: #141417;
            --bg-surface-hover: #1c1c21;
            --bg-card: #18181b;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #3b82f6;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --radius-lg: 1.25rem;
            --radius-md: 0.875rem;
            --radius-sm: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.875rem 1.5rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .menu-icon {
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .menu-icon:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-icon span {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-icon.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .menu-icon.active span:nth-child(2) {
            opacity: 0;
            transform: translateX(-10px);
        }

        .menu-icon.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .logo {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .logo-icon {
            color: var(--accent-blue);
            font-weight: 700;
        }

        /* Language Toggle */
        .language-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
        }

        .lang-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-secondary);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        input:checked + .slider:before {
            transform: translateX(14px);
            background-color: #ffffff;
        }

        /* Main Content */
        .main-content {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 64px;
            padding-bottom: 120px;
            max-width: 840px;
            width: 100%;
            margin: 0 auto;
        }

        /* Welcome State */
        .welcome-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: opacity 0.3s ease, transform 0.3s ease;
            min-height: calc(100vh - 200px);
        }

        .welcome-state.hidden {
            opacity: 0;
            transform: translateY(-16px);
            pointer-events: none;
            position: absolute;
        }

        .stad-sparkle {
            width: 52px;
            height: 52px;
            margin-bottom: 1.25rem;
            filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.25));
        }

        .welcome-salutation {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.375rem;
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            max-width: 460px;
            line-height: 1.35;
        }

        /* Chat Container */
        .chat-container {
            position: relative;
            flex: 1;
            padding: 1.5rem 1rem;
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto; 
            scroll-behavior: smooth;
            width: 100%;
        }

        .chat-container.active {
            display: flex;
        }

        /* User Message */
        .user-message {
            align-self: flex-end;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.875rem 1.25rem;
            border-radius: 1.25rem 1.25rem 0.25rem 1.25rem;
            max-width: 82%;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(16px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* AI Response */
        .ai-response {
            align-self: flex-start;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem 1.25rem 1.25rem 0.25rem;
            padding: 1.25rem;
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-text {
            font-size: 0.95rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Input Area */
        .input-area {
            max-width: 800px;
            width: calc(100% - 2rem);
            margin: 0 auto;
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .input-area:focus-within {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(59, 130, 246, 0.2);
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-field {
            display: flex;
            align-items: center;
        }

        .input-field textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            resize: none; 
            overflow-y: auto;
            padding: 0.25rem 0; 
            max-height: 120px;
            font-family: inherit;
            line-height: 1.5;
        }

        .input-field textarea::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.375rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .verse-btn, .pry-btn, .wave-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .verse-btn:hover, .pry-btn:hover, .wave-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .send-btn {
            background: var(--accent-blue);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: none; 
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(0);
            color: #ffffff;
        }

        .send-btn.visible {
            display: flex;
            transform: scale(1);
        }

        .send-btn:hover {
            background: var(--accent-blue-hover);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.5rem 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        /* Modals & Sheets Overlay */
        .action-sheet-overlay, .offcanvas-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .action-sheet-overlay.active, .offcanvas-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Action Sheet (Verse Picker) */
        .action-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 520px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        .action-sheet.active {
            transform: translateY(0);
        }

        .action-sheet-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-sheet-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close-action-sheet, .close-offcanvas {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .close-action-sheet:hover, .close-offcanvas:hover {
            color: var(--text-primary);
        }

        .action-sheet-body {
            padding: 1.25rem;
        }

        .verse-selection-controls {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .verse-selection-controls label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: -0.375rem;
        }

        .styled-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .styled-select:focus {
            border-color: var(--accent-blue);
        }

        .select-verse-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--accent-blue);
            border: none;
            color: #ffffff;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .select-verse-btn:hover {
            background: var(--accent-blue-hover);
        }

        /* Sidebar Offcanvas */
        .offcanvas-sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 320px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .offcanvas-sidebar.active {
            transform: translateX(0);
        }

        .offcanvas-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .offcanvas-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .offcanvas-body {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        .new-chat-btn svg {
            fill: var(--accent-blue);
        }

        .chat-history-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            padding: 0 0.5rem;
        }

        .chat-history-list {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .chat-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0.875rem;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .chat-history-item:hover {
            background: var(--bg-card);
        }

        .chat-history-item.active {
            background: var(--bg-card);
            border-color: var(--border-color);
        }

        .chat-preview {
            flex: 1;
            overflow: hidden;
            margin-right: 0.5rem;
        }

        .chat-preview-title {
            font-size: 0.875rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.125rem;
        }

        .chat-preview-date {
            font-size: 0.725rem;
            color: var(--text-muted);
        }

        .delete-chat-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.4;
            transition: opacity 0.2s;
            color: var(--text-secondary);
        }

        .delete-chat-btn:hover {
            opacity: 1;
            color: #ef4444;
        }

        .no-chats-message {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Quranic Text Styling */
        .arabic-text {
            font-family: 'Amiri', 'Scheherazade New', serif;
            font-size: 1.6rem;
            line-height: 2.2;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border-right: 3px solid var(--accent-blue);
            margin-bottom: 0.875rem;
            color: #ffffff;
            text-align: right;
            direction: rtl;
        }

        .translation-text {
            font-size: 0.925rem;
            line-height: 1.6;
            padding: 0.875rem 1rem;
            background: rgba(16, 185, 129, 0.04);
            border-radius: var(--radius-sm);
            border-left: 2px solid var(--accent-green);
            color: var(--text-secondary);
        }

        .verse-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .surah-title {
            color: var(--accent-blue);
            font-weight: 600;
        }

        .verse-container {
            margin: 0.875rem 0;
            padding: 1rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .verse-reference {
            font-size: 0.825rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.875rem;
            text-align: center;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
        }

        /* Voice Panel Offcanvas */
        .offcanvas-voice {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 320px;
        }

        .offcanvas-voice.active {
            transform: translateY(0);
        }

        .offcanvas-voice-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .offcanvas-voice-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .offcanvas-voice-body {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .wave-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            margin-bottom: 2rem;
        }

        .wave-bars {
            display: none; 
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 60px;
        }

        .wave-bars.active {
            display: flex;
        }

        .wave-bar {
            width: 4px;
            height: 32px;
            background: var(--accent-blue);
            border-radius: 2px;
            opacity: 0.7;
            animation: wave 1.2s infinite ease-in-out;
        }

        .wave-bar:nth-child(1) { animation-delay: -0.6s; }
        .wave-bar:nth-child(2) { animation-delay: -0.5s; }
        .wave-bar:nth-child(3) { animation-delay: -0.4s; }
        .wave-bar:nth-child(4) { animation-delay: -0.3s; }

// Markdown Parser
class MarkdownParser {
    static parse(text) {
        if (!text) return '';

        let html = text;

        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.*?)_/g, '<em>$1</em>');

        html = this.formatNumberedLists(html);
        html = this.formatUnorderedLists(html);

        html = html.replace(/\n\n+/g, '</p><p>');
        html = html.replace(/\n/g, '<br>');
        html = `<p>${html}</p>`;

        html = html.replace(/<p><\/p>/g, '');
        html = html.replace(/<p><br><\/p>/g, '');

        return html;
    }

    static formatNumberedLists(text) {
        const lines = text.split('\n');
        let inList = false;
        let listHtml = '';
        let result = [];

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            const listMatch = line.match(/^(\d+)\.\s+(.*)/);

            if (listMatch) {
                if (!inList) {
                    inList = true;
                    listHtml = '<ol class="ai-list numbered">';
                }
                const itemText = listMatch[2];
                listHtml += `<li>${this.parseInlineMarkdown(itemText)}</li>`;
            } else {
                if (inList) {
                    inList = false;
                    listHtml += '</ol>';
                    result.push(listHtml);
                    listHtml = '';
                }
                result.push(line);
            }
        }

        if (inList) {
            listHtml += '</ol>';
            result.push(listHtml);
        }

        return result.join('\n');
    }

    static formatUnorderedLists(text) {
        const lines = text.split('\n');
        let inList = false;
        let listHtml = '';
        let result = [];

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            const listMatch = line.match(/^[-*]\s+(.*)/);

            if (listMatch) {
                if (!inList) {
                    inList = true;
                    listHtml = '<ul class="ai-list bulleted">';
                }
                const itemText = listMatch[1];
                listHtml += `<li>${this.parseInlineMarkdown(itemText)}</li>`;
            } else {
                if (inList) {
                    inList = false;
                    listHtml += '</ul>';
                    result.push(listHtml);
                    listHtml = '';
                }
                result.push(line);
            }
        }

        if (inList) {
            listHtml += '</ul>';
            result.push(listHtml);
        }

        return result.join('\n');
    }

    static parseInlineMarkdown(text) {
        let html = text;
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/_(.*?)_/g, '<em>$1</em>');
        html = html.replace(/"(.*?)"/g, '<span dir="rtl" class="arabic-inline">$1</span>');
        return html;
    }
}

// Database Service
class DatabaseService {
    static async saveChat(chatId, title, messages, language = 'id', userId) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-ID': userId
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    title: title,
                    messages: messages,
                    language: language
                })
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to save chat to database:', error);
            return { success: false, error: error.message };
        }
    }

    static async loadChats(userId, limit = 50, offset = 0) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history?limit=${limit}&offset=${offset}`, {
                headers: {
                    'X-User-ID': userId
                }
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to load chats from database:', error);
            return { success: false, data: [] };
        }
    }

    static async loadChat(chatId, userId) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history/${chatId}`, {
                headers: {
                    'X-User-ID': userId
                }
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to load chat from database:', error);
            return { success: false, error: error.message };
        }
    }

    static async deleteChat(chatId, userId) {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/chat-history/${chatId}`, {
                method: 'DELETE',
                headers: {
                    'X-User-ID': userId
                }
            });

            return await response.json();
        } catch (error) {
            console.error('Failed to delete chat from database:', error);
            return { success: false, error: error.message };
        }
    }

    static saveToLocalStorageBackup(chatId, chatData) {
        try {
            const backupKey = `chat_backup_${chatId}`;
            const backupList = JSON.parse(localStorage.getItem('chat_backup_list') || '[]');

            localStorage.setItem(backupKey, JSON.stringify(chatData));

            if (!backupList.includes(chatId)) {
                backupList.push(chatId);
                localStorage.setItem('chat_backup_list', JSON.stringify(backupList));
            }
        } catch (error) {
            console.error('LocalStorage backup failed:', error);
        }
    }

    static loadFromLocalStorageBackup() {
        try {
            const backupList = JSON.parse(localStorage.getItem('chat_backup_list') || '[]');
            const chats = [];

            backupList.forEach(chatId => {
                const chatData = localStorage.getItem(`chat_backup_${chatId}`);
                if (chatData) {
                    chats.push(JSON.parse(chatData));
                }
            });

            return chats.sort((a, b) => 
                new Date(b.updatedAt || b.createdAt).getTime() - 
                new Date(a.updatedAt || a.createdAt).getTime()
            );
        } catch (error) {
            console.error('Failed to load from localStorage backup:', error);
            return [];
        }
    }

    static deleteFromLocalStorageBackup(chatId) {
        try {
            localStorage.removeItem(`chat_backup_${chatId}`);
            const backupList = JSON.parse(localStorage.getItem('chat_backup_list') || '[]');
            const newBackupList = backupList.filter(id => id !== chatId);
            localStorage.setItem('chat_backup_list', JSON.stringify(newBackupList));
        } catch (error) {
            console.error('Failed to delete from localStorage backup:', error);
        }
    }
}

            return [];
        }

    static async sendQuestion(question, language) {

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

            if (!response.ok) {

    }
}

// Chat Manager
class ChatManager {
    constructor(state, dom) {
        this.state = state;
        this.dom = dom;
    }

    async createNewChat(shouldLoad = true) {
        const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const newChat = {
            id: chatId,
            title: this.getLocalizedText('New Chat', 'Obrolan Baru'),
            messages: [],
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            language: this.state.currentLanguage
        };

        const dbResult = await DatabaseService.saveChat(
            chatId,
            newChat.title,
            newChat.messages,
            newChat.language,
            this.state.userId
        );

        if (dbResult.success) {
            this.state.chatHistory.unshift(newChat);
            DatabaseService.saveToLocalStorageBackup(chatId, newChat);
        } else {
            this.state.chatHistory.unshift(newChat);
            DatabaseService.saveToLocalStorageBackup(chatId, newChat);
        }

        if (shouldLoad) {
            await this.loadChat(chatId);
        }

        await this.renderChatHistory();
        return newChat;
    }

    async loadChat(chatId) {
        try {
            let chat = this.state.chatHistory.find(c => c.id === chatId);

            if (!chat) {
                const dbResult = await DatabaseService.loadChat(chatId, this.state.userId);

                if (dbResult.success && dbResult.data) {
                    chat = {
                        id: dbResult.data.chat_id,
                        title: dbResult.data.title,
                        messages: JSON.parse(dbResult.data.messages),
                        createdAt: dbResult.data.created_at,
                        updatedAt: dbResult.data.updated_at,
                        language: dbResult.data.language || 'id'
                    };
                    this.state.chatHistory.push(chat);
                } else {
                    const backupChats = DatabaseService.loadFromLocalStorageBackup();
                    chat = backupChats.find(c => c.id === chatId);
                    if (chat) this.state.chatHistory.push(chat);
                }
            }

            if (!chat) {
                this.showError('Percakapan tidak ditemukan');
                return;
            }

            this.state.currentChatId = chat.id;
            this.state.isFirstMessage = chat.messages.length === 0;

            this.clearChatContainer();

            if (this.state.isFirstMessage) {
                this.showWelcomeState();
            } else {
                this.hideWelcomeState();
                chat.messages.forEach(message => {
                    if (message.type === 'verse') {
                        this.displayVerseResponse(message.ai);
                    } else if (message.type === 'prayer') {
                        if (message.ai && message.ai.data) {
                            this.displayPrayerReading(message.ai.data);
                        } else {
                            this.displayPrayerAIResponse(message.ai);
                        }
                    } else {
                        this.appendUserMessage(message.user);
                        if (typeof message.ai === 'string') {
                            this.appendAIResponse(message.ai);
                        } else if (message.ai && message.ai.answer) {
                            this.appendAIResponse(message.ai.answer);
                        } else if (message.ai && message.ai.response) {
                            this.appendAIResponse(message.ai.response);
                        }
                    }
                });
            }

            await this.renderChatHistory();
            this.updateChatTitle(chat.title);
            this.scrollToBottom();
        } catch (error) {
            console.error('Failed to load chat:', error);
            this.showError('Gagal memuat percakapan');
        }
    }

    appendUserMessage(text) {
        const messageEl = this.createMessageElement('user-message', text);
        this.dom.chatContainer.appendChild(messageEl);
    }

    appendAIResponse(text) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';
        responseEl.innerHTML = `<div class="ai-text">${text}</div>`;
        this.dom.chatContainer.appendChild(responseEl);
    }

    displayVerseResponse(verseData) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';

        const html = `
            <div class="verse-header">
                <span class="surah-title">${verseData.surahNameArabic || verseData.surahName} (${verseData.surahNumber}:${verseData.ayahNumber})</span>
            </div>
            <div class="arabic-text" dir="rtl">
                ${verseData.arabicText}
            </div>
            <div class="translation-text">
                ${this.getLocalizedText('Translation:', 'Terjemahan:')} ${verseData.translationText}
            </div>
        `;

        responseEl.innerHTML = html;
        this.dom.chatContainer.appendChild(responseEl);
        this.scrollToBottom();
    }

    showError(message) {
        const errorEl = document.createElement('div');
        errorEl.className = 'ai-response error-message';
        errorEl.textContent = message;
        this.dom.chatContainer.appendChild(errorEl);
        this.scrollToBottom();
    }

    createMessageElement(className, text) {
        const element = document.createElement('div');
        element.className = className;
        element.textContent = text;
        return element;
    }

    showTypingIndicator() {
        const typingEl = document.createElement('div');
        typingEl.className = 'ai-response';
        typingEl.innerHTML = `
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;
        this.dom.chatContainer.appendChild(typingEl);
        this.scrollToBottom();
        return typingEl;
    }

    removeTypingIndicator() {
        const typingEl = this.dom.chatContainer.querySelector('.typing-indicator');
        if (typingEl) {
            typingEl.parentElement.remove();
        }
    }

    showWelcomeState() {
        this.dom.welcomeState.classList.remove('hidden');
        this.dom.chatContainer.classList.remove('active');
    }

    hideWelcomeState() {
        this.dom.welcomeState.classList.add('hidden');
        this.dom.chatContainer.classList.add('active');
    }

    clearChatContainer() {
        this.dom.chatContainer.innerHTML = '';
    }

    updateChatTitle(title) {
        this.dom.chatTitle.innerHTML = `<span class="logo-icon">${title || this.getLocalizedText('Ustad', 'Ustad')}</span> AI`;
    }

    scrollToBottom() {
        setTimeout(() => {
            if (this.dom.chatContainer) {
                this.dom.chatContainer.scrollTop = this.dom.chatContainer.scrollHeight;
            }
        }, 10);
    }

    async loadFromDatabase() {
        try {
            const result = await DatabaseService.loadChats(this.state.userId, 50, 0);

            if (result.success && result.data) {
                this.state.chatHistory = result.data.map(dbChat => ({
                    id: dbChat.chat_id,
                    title: dbChat.title,
                    messages: JSON.parse(dbChat.messages),
                    createdAt: dbChat.created_at,
                    updatedAt: dbChat.updated_at,
                    language: dbChat.language || 'id'
                })).sort((a, b) => 
                    new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime()
                );
                return true;
            } else {
                this.state.chatHistory = DatabaseService.loadFromLocalStorageBackup();
                return false;
            }
        } catch (error) {
            this.state.chatHistory = DatabaseService.loadFromLocalStorageBackup();
            return false;
        }
    }

    async renderChatHistory() {
        if (!this.dom.chatHistoryList) return;

        if (this.state.chatHistory.length === 0) {
            await this.loadFromDatabase();
        }

        this.dom.chatHistoryList.innerHTML = '';

        if (this.state.chatHistory.length === 0) {
            this.dom.chatHistoryList.innerHTML = `
                <div class="no-chats-message">
                    ${this.getLocalizedText('No chat history yet.', 'Belum ada riwayat percakapan')}
                </div>
            `;
            return;
        }

        this.state.chatHistory.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-history-item ${chat.id === this.state.currentChatId ? 'active' : ''}`;
            item.dataset.chatId = chat.id;

            item.innerHTML = `
                <div class="chat-preview">
                    <div class="chat-preview-title">${chat.title}</div>
                    <div class="chat-preview-date">${this.formatDate(chat.updatedAt || chat.createdAt)}</div>
                </div>
                <button class="delete-chat-btn" data-chat-id="${chat.id}" title="${this.getLocalizedText('Delete', 'Hapus')}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            `;

            item.addEventListener('click', () => this.loadChat(chat.id));

            const deleteBtn = item.querySelector('.delete-chat-btn');
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                this.deleteChat(chat.id);
            });

            this.dom.chatHistoryList.appendChild(item);
        });
    }

    async deleteChat(chatId) {
        const message = this.getLocalizedText(
            'Are you sure you want to delete this conversation?',
            'Apakah Anda yakin ingin menghapus percakapan ini?'
        );

        if (!confirm(message)) return;

        const wasActiveChat = this.state.currentChatId === chatId;

        await DatabaseService.deleteChat(chatId, this.state.userId);
        DatabaseService.deleteFromLocalStorageBackup(chatId);

        this.state.chatHistory = this.state.chatHistory.filter(chat => chat.id !== chatId);

        if (wasActiveChat) {
            if (this.state.chatHistory.length > 0) {
                await this.loadChat(this.state.chatHistory[0].id);
            } else {
                this.state.reset();
                this.showWelcomeState();
            }
        }

        await this.renderChatHistory();
    }

    async saveMessageToHistory(userMessage, aiResponse, type = 'text') {
        let currentChat = this.state.chatHistory.find(c => c.id === this.state.currentChatId);

        if (!currentChat) {
            currentChat = await this.createNewChat(false);
            this.state.currentChatId = currentChat.id;
        }

        if (currentChat.messages.length === 0) {
            const title = userMessage.substring(0, 40) + (userMessage.length > 40 ? '...' : '');
            currentChat.title = title;
            this.updateChatTitle(title);
        }

        currentChat.messages.push({
            user: userMessage,
            ai: aiResponse,
            type: type,
            timestamp: new Date().toISOString()
        });

        currentChat.updatedAt = new Date().toISOString();
        currentChat.language = this.state.currentLanguage;

        await DatabaseService.saveChat(
            currentChat.id,
            currentChat.title,
            currentChat.messages,
            currentChat.language,
            this.state.userId
        );

        DatabaseService.saveToLocalStorageBackup(currentChat.id, currentChat);

        this.state.chatHistory = this.state.chatHistory.filter(c => c.id !== currentChat.id);
        this.state.chatHistory.unshift(currentChat);

        await this.renderChatHistory();
    }

    formatDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diffTime = Math.abs(now - date);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays === 0) {
            return this.getLocalizedText('Today', 'Hari ini');
        } else if (diffDays === 1) {
            return this.getLocalizedText('Yesterday', 'Kemarin');
        } else {
            return date.toLocaleDateString(this.state.currentLanguage === 'id' ? 'id-ID' : 'en-US', {
                day: 'numeric',
                month: 'short'
            });
        }
    }

    getLocalizedText(english, indonesian) {
        return this.state.currentLanguage === 'id' ? indonesian : english;
    }
}

// Verse Manager
class VerseManager {
    constructor(state, dom, chatManager) {
        this.state = state;
        this.dom = dom;
        this.chatManager = chatManager;
    }

    async loadSurahData() {
        try {
            const response = await fetch(`${Constants.WORKER_URL}/api/surah`);
            if (!response.ok) throw new Error('Failed to load surah list');

            const data = await response.json();
            this.state.surahData = data;
            this.buildSurahMap();
            return true;
        } catch (error) {
            return false;
        }
    }

    buildSurahMap() {
        this.state.surahMap.clear();
        this.state.surahData.forEach(surah => {
            this.state.surahMap.set(surah.id, {
                id: surah.id,
                name: surah.name,
                nameArabic: surah.name,
                nameTranslation: surah.translation,
                ayahs: surah.total_verses
            });
        });
    }

    populateSurahSelect() {
        if (!this.dom.surahSelect || this.state.surahData.length === 0) return;

        this.dom.surahSelect.innerHTML = '';
        this.state.surahData.forEach(surah => {
            const option = document.createElement('option');
            option.value = surah.id;
            option.textContent = `${surah.id}. ${surah.name} (${surah.translation}) - ${surah.total_verses} ayat`;
            this.dom.surahSelect.appendChild(option);
        });

        this.populateVerseSelect();
    }

    populateVerseSelect() {
        if (!this.dom.verseSelect) return;

        const selectedSurahId = parseInt(this.dom.surahSelect.value);
        const selectedSurah = this.state.surahMap.get(selectedSurahId);

        this.dom.verseSelect.innerHTML = '';

        if (selectedSurah) {
            for (let i = 1; i <= selectedSurah.ayahs; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = this.chatManager.getLocalizedText(`Verse ${i}`, `Ayat ${i}`);
                this.dom.verseSelect.appendChild(option);
            }
        }
    }

    async getSpecificVerse() {
        const surahNumber = this.dom.surahSelect.value;
        const ayahNumber = parseInt(this.dom.verseSelect.value);

        if (!surahNumber || !ayahNumber) return;

        this.closeActionSheet();

        const surahInfo = this.state.surahMap.get(parseInt(surahNumber));
        if (!surahInfo) return;

        const userMessage = this.chatManager.getLocalizedText(
            `Show ${surahInfo.name} verse ${ayahNumber}`,
            `${surahInfo.name} ayat ${ayahNumber}`
        );

        this.chatManager.appendUserMessage(userMessage);

        if (this.state.isFirstMessage) {
            this.chatManager.hideWelcomeState();
            this.state.isFirstMessage = false;
            if (this.state.currentChatId === null) {
                this.chatManager.createNewChat(false);
            }
        }

        const typingEl = this.chatManager.showTypingIndicator();

        try {
            const arabicResponse = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/quran-uthmani`);
            const arabicData = await arabicResponse.json();

            const translationResponse = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/id.indonesian`);
            const translationData = await translationResponse.json();

            if (arabicData.code !== 200 || translationData.code !== 200) {
                throw new Error('Failed to fetch verse data');
            }

            const arabicAyah = arabicData.data.ayahs.find(ayah => ayah.numberInSurah === ayahNumber);
            const translationAyah = translationData.data.ayahs.find(ayah => ayah.numberInSurah === ayahNumber);

            typingEl.remove();

            const verseData = {
                surahNumber: parseInt(surahNumber),
                surahName: surahInfo.name,
                surahNameArabic: surahInfo.nameArabic,
                ayahNumber: ayahNumber,
                arabicText: arabicAyah?.text || '',
                translationText: translationAyah?.text || 'Terjemahan tidak tersedia'
            };

            this.chatManager.displayVerseResponse(verseData);
            this.chatManager.saveMessageToHistory(userMessage, verseData, 'verse');

        } catch (error) {
            typingEl.remove();
            this.chatManager.showError('Gagal memuat ayat Al-Quran.');
        }
    }

    openActionSheet() {
        this.dom.actionSheetOverlay.classList.add('active');
        this.dom.actionSheet.classList.add('active');

        if (this.state.surahData.length > 0) {
            this.populateSurahSelect();
        } else {
            this.dom.surahSelect.innerHTML = `<option>Memuat Surah...</option>`;
            this.loadSurahData().then(() => this.populateSurahSelect());
        }
    }

    closeActionSheet() {
        this.dom.actionSheetOverlay.classList.remove('active');
        this.dom.actionSheet.classList.remove('active');
    }
}

// Voice Manager
class VoiceManager {
    constructor(state, dom, chatManager) {
        this.state = state;
        this.dom = dom;
        this.chatManager = chatManager;
        this.speechManager = new WebSpeechManager();
        this.isListening = false;
        this.isSpeaking = false;
    }

    openVoicePanel() {
        this.dom.voiceOffcanvasOverlay.classList.add('active');
        this.dom.offcanvasVoice.classList.add('active');
        this.speechManager.setLanguage(this.state.currentLanguage);
        this.stopWaveAnimation();
        this.resetMicButton();
    }

    toggleVoiceRecording() {
        const micButton = document.getElementById('micButton');
        if (!this.isListening) {
            this.startVoiceRecording();
            micButton.classList.add('listening');
        } else {
            this.stopVoiceRecording();
            micButton.classList.remove('listening');
        }
    }

    startVoiceRecording() {
        if (this.isListening) return;

        this.startWaveAnimation();

        this.speechManager.startListening(
            () => { this.isListening = true; },
            (transcript) => {
                this.stopVoiceRecording();
                this.processQuestion(transcript);
            },
            (error) => {
                this.isListening = false;
                this.stopWaveAnimation();
                this.resetMicButton();
            },
            () => {
                this.isListening = false;
                this.stopWaveAnimation();
            }
        );
    }

    stopVoiceRecording() {
        if (this.isListening) {
            this.speechManager.stopListening();
            this.isListening = false;
            this.stopWaveAnimation();
        }
    }

    async processQuestion(question) {
        try {
            this.chatManager.appendUserMessage(question);
            const typingEl = this.chatManager.showTypingIndicator();

            const response = await ApiService.sendQuestion(question, this.state.currentLanguage);
            this.chatManager.removeTypingIndicator();

            if (response.success) {
                this.displayAIResponseInChat(response);
                this.chatManager.saveMessageToHistory(question, response, 'quran_ai');
                this.speakResponse(response.answer);
            } else {
                this.chatManager.showError('AI tidak bisa menjawab saat ini.');
            }
        } catch (error) {
            this.chatManager.showError('Terjadi kesalahan. Silakan coba lagi.');
        }
    }

    displayAIResponseInChat(response) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';

        let html = `<div class="ai-text">${response.answer}</div>`;

        if (response.verses_data && response.verses_data.length > 0) {
            html += `<div class="verses-section">`;
            response.verses_data.forEach(verse => {
                html += `
                    <div class="verse-container">
                        <div class="verse-reference">${verse.reference}</div>
                        <div class="arabic-text" dir="rtl">${verse.verse_arabic}</div>
                        <div class="translation-text">${verse.verse_translation}</div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        responseEl.innerHTML = html;
        this.dom.chatContainer.appendChild(responseEl);
        this.chatManager.scrollToBottom();
    }

    speakResponse(text) {
        const lang = this.state.currentLanguage === 'id' ? 'id-ID' : 'en-US';
        this.speechManager.speak(text, {
            lang: lang,
            rate: 0.9,
            onStart: () => { this.isSpeaking = true; },
            onEnd: () => { this.isSpeaking = false; },
            onError: () => { this.isSpeaking = false; }
        });
    }

    startWaveAnimation() {
        const waveBars = document.querySelector('.wave-bars');
        if (waveBars) waveBars.classList.add('active');
    }

    stopWaveAnimation() {
        const waveBars = document.querySelector('.wave-bars');
        if (waveBars) waveBars.classList.remove('active');
    }

    resetMicButton() {
        const micButton = document.getElementById('micButton');
        if (micButton) micButton.classList.remove('listening');
    }

    closeVoicePanel() {
        this.stopVoiceRecording();
        this.speechManager.stopSpeaking();
        this.dom.voiceOffcanvasOverlay.classList.remove('active');
        this.dom.offcanvasVoice.classList.remove('active');
        this.stopWaveAnimation();
        this.resetMicButton();
    }
}

class WebSpeechManager {
    constructor() {
        this.synth = window.speechSynthesis;
        this.recognition = null;
        this.isListening = false;
        this.isSpeaking = false;
        this.initSpeechRecognition();
    }

    initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.recognition = new SpeechRecognition();
        this.recognition.continuous = false;
        this.recognition.interimResults = false;
        this.recognition.lang = 'id-ID';

        this.recognition.onstart = () => {
            this.isListening = true;
            if (this.onStartCallback) this.onStartCallback();
        };

        this.recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (this.onResultCallback) this.onResultCallback(transcript);
        };

        this.recognition.onerror = (event) => {
            this.isListening = false;
            if (this.onErrorCallback) this.onErrorCallback(event.error);
        };

        this.recognition.onend = () => {
            this.isListening = false;
            if (this.onEndCallback) this.onEndCallback();
        };
    }

    setLanguage(lang) {
        if (this.recognition) {
            this.recognition.lang = lang === 'id' ? 'id-ID' : 'en-US';
        }
    }

    startListening(onStart, onResult, onError, onEnd) {
        if (!this.recognition) return false;

        this.onStartCallback = onStart;
        this.onResultCallback = onResult;
        this.onErrorCallback = onError;
        this.onEndCallback = onEnd;

        try {
            this.recognition.start();
            return true;
        } catch (error) {
            return false;
        }
    }

    stopListening() {
        if (this.recognition && this.isListening) {
            this.recognition.stop();
            this.isListening = false;
        }
    }

    speak(text, options = {}) {
        if (!this.synth) return false;

        if (this.isSpeaking) {
            this.synth.cancel();
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = options.lang || 'id-ID';
        utterance.rate = options.rate || 0.9;

        utterance.onstart = () => {
            this.isSpeaking = true;
            if (options.onStart) options.onStart();
        };

        utterance.onend = () => {
            this.isSpeaking = false;
            if (options.onEnd) options.onEnd();
        };

        this.synth.speak(utterance);
        return true;
    }

    stopSpeaking() {
        if (this.isSpeaking) {
            this.synth.cancel();
            this.isSpeaking = false;
        }
    }
}

// AI Response Handler
class AIResponseHandler {
    constructor(state, dom, chatManager) {
        this.state = state;
        this.dom = dom;
        this.chatManager = chatManager;
    }

    displayAIResponse(backendResponse) {
        const responseEl = document.createElement('div');
        responseEl.className = 'ai-response';

        let html = '';

        if (backendResponse.success) {
            html += `<div class="ai-text">${backendResponse.answer}</div>`;

            if (backendResponse.verses_data && backendResponse.verses_data.length > 0) {
                html += `<div class="verses-section" style="margin-top: 1rem;">`;
                backendResponse.verses_data.forEach(verse => {
                    html += `
                        <div class="verse-container">
                            <div class="verse-reference">${verse.reference}</div>
                            <div class="arabic-text" dir="rtl">${verse.verse_arabic}</div>
                            <div class="translation-text">${verse.verse_translation}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            if (backendResponse.disclaimer) {
                html += `<div class="disclaimer">${backendResponse.disclaimer}</div>`;
            }

        } else {
            html += `<div class="error-message">${backendResponse.error || 'Terjadi kesalahan'}</div>`;
        }

        responseEl.innerHTML = html;
        this.dom.chatContainer.appendChild(responseEl);
        this.chatManager.scrollToBottom();
    }
}

// Main Application
class QuranAIApp {
    constructor() {
        this.state = new AppState();
        this.dom = new DomElements();
        this.chatManager = new ChatManager(this.state, this.dom);
        this.verseManager = new VerseManager(this.state, this.dom, this.chatManager);
        this.voiceManager = new VoiceManager(this.state, this.dom, this.chatManager);
        this.aiHandler = new AIResponseHandler(this.state, this.dom, this.chatManager);

        this.sendMessage = this.sendMessage.bind(this);
        this.toggleLanguage = this.toggleLanguage.bind(this);
        this.openOffcanvasMenu = this.openOffcanvasMenu.bind(this);
        this.closeOffcanvasMenu = this.closeOffcanvasMenu.bind(this);
        this.openOffcanvasVoice = this.openOffcanvasVoice.bind(this);
        this.closeOffcanvasVoice = this.closeOffcanvasVoice.bind(this);
        this.updateSendButtonState = this.updateSendButtonState.bind(this);
    }

    async init() {
        if (!this.dom.validate()) return;

        this.setupEventListeners();
        await this.loadInitialData();
        this.updateUI();
    }

    async loadInitialData() {
        await this.chatManager.loadFromDatabase();
        await this.verseManager.loadSurahData();

        if (this.state.chatHistory.length > 0) {
            await this.chatManager.loadChat(this.state.chatHistory[0].id);
        }
    }

    updateUI() {
        this.dom.langLabel.textContent = Constants.SUPPORTED_LANGUAGES[this.state.currentLanguage];
        this.dom.languageToggle.checked = this.state.currentLanguage === 'en';

        this.dom.messageInput.placeholder = this.chatManager.getLocalizedText(
            'Ask about the Quran...',
            'Tanyakan tentang Al-Quran...'
        );

        const welcomeText = this.dom.welcomeState.querySelector('.welcome-text');
        if (welcomeText) {
            welcomeText.textContent = this.chatManager.getLocalizedText(
                'How can I help you regarding the Quran?',
                'Ada yang bisa saya bantu tentang Al-Quran?'
            );
        }
    }

    setupEventListeners() {
        this.dom.sendBtn.addEventListener('click', this.sendMessage);

        this.dom.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.sendMessage();
            }
        });

        this.dom.messageInput.addEventListener('input', () => {
            this.dom.messageInput.style.height = 'auto';
            this.dom.messageInput.style.height = `${this.dom.messageInput.scrollHeight}px`;
            this.updateSendButtonState();
        });

        this.dom.menuIcon.addEventListener('click', this.openOffcanvasMenu);
        this.dom.offcanvasOverlay.addEventListener('click', this.closeOffcanvasMenu);
        if (this.dom.closeOffcanvas) {
            this.dom.closeOffcanvas.addEventListener('click', this.closeOffcanvasMenu);
        }

        this.dom.newChatBtn.addEventListener('click', () => {
            this.chatManager.createNewChat();
        });

        this.dom.languageToggle.addEventListener('change', this.toggleLanguage);

        this.dom.selectVerseBtn.addEventListener('click', () => {
            this.verseManager.openActionSheet();
        });

        if (this.dom.closeActionSheet) {
            this.dom.closeActionSheet.addEventListener('click', () => {
                this.verseManager.closeActionSheet();
            });
        }

        if (this.dom.actionSheetOverlay) {
            this.dom.actionSheetOverlay.addEventListener('click', () => {
                this.verseManager.closeActionSheet();
            });
        }

        if (this.dom.surahSelect) {
            this.dom.surahSelect.addEventListener('change', () => {
                this.verseManager.populateVerseSelect();
            });
        }

        if (this.dom.goVerseBtn) {
            this.dom.goVerseBtn.addEventListener('click', () => {
                this.verseManager.getSpecificVerse();
            });
        }

        if (this.dom.waveBtn) {
            this.dom.waveBtn.addEventListener('click', this.openOffcanvasVoice);
        }

        if (this.dom.closeOffcanvasVoice) {
            this.dom.closeOffcanvasVoice.addEventListener('click', this.closeOffcanvasVoice);
        }

        if (this.dom.voiceOffcanvasOverlay) {
            this.dom.voiceOffcanvasOverlay.addEventListener('click', this.closeOffcanvasVoice);
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('#micButton')) {
                this.voiceManager.toggleVoiceRecording();
            }
        });
    }

    async sendMessage() {
        const userMessage = this.dom.messageInput.value.trim();
        if (!userMessage) return;

        this.dom.messageInput.value = '';
        this.dom.messageInput.style.height = 'auto';
        this.updateSendButtonState();

        this.chatManager.appendUserMessage(userMessage);

        if (this.state.isFirstMessage) {
            this.chatManager.hideWelcomeState();
            this.state.isFirstMessage = false;
            if (this.state.currentChatId === null) {
                await this.chatManager.createNewChat(false);
            }
        }

        const typingEl = this.chatManager.showTypingIndicator();

        try {
            const response = await ApiService.sendQuestion(userMessage, this.state.currentLanguage);
            typingEl.remove();

            this.aiHandler.displayAIResponse(response);
            await this.chatManager.saveMessageToHistory(userMessage, response, 'quran_ai');

        } catch (error) {
            typingEl.remove();
            this.chatManager.showError('Terjadi kesalahan saat memproses respons. Silakan coba lagi.');
        }
    }

    toggleLanguage() {
        const newLanguage = this.dom.languageToggle.checked ? 'en' : 'id';

        if (this.state.setLanguage(newLanguage)) {
            this.updateUI();
            this.chatManager.renderChatHistory();

            if (this.state.currentChatId) {
                const currentChat = this.state.chatHistory.find(c => c.id === this.state.currentChatId);
                if (currentChat) {
                    this.chatManager.updateChatTitle(currentChat.title);
                }
            }
        }
    }

    updateSendButtonState() {
        const hasText = this.dom.messageInput.value.trim().length > 0;

        if (hasText) {
            this.dom.sendBtn.classList.add('visible');
            if (this.dom.waveBtn) this.dom.waveBtn.classList.add('hidden');
        } else {
            this.dom.sendBtn.classList.remove('visible');
            if (this.dom.waveBtn) this.dom.waveBtn.classList.remove('hidden');
        }
    }

    openOffcanvasMenu() {
        this.dom.offcanvasOverlay.classList.add('active');
        this.dom.offcanvasSidebar.classList.add('active');
        this.dom.menuIcon.classList.add('active');
    }

    closeOffcanvasMenu() {
        this.dom.offcanvasOverlay.classList.remove('active');
        this.dom.offcanvasSidebar.classList.remove('active');
        this.dom.menuIcon.classList.remove('active');
    }

    openOffcanvasVoice() {
        this.voiceManager.openVoicePanel();
    }

    closeOffcanvasVoice() {
        this.voiceManager.closeVoicePanel();
    }
}
